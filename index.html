<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ACG DNA Web，一个无需账号的本地属性图编辑器。"
    />
    <meta name="theme-color" content="#f7f5f2" />
    <title>ACG DNA Web</title>
  </head>
  <body>
    <div id="root">
      <main
        style="
          min-height: 100vh;
          display: grid;
          place-items: center;
          padding: 24px;
          color: #f5f5f7;
          background: #18181b;
          font-family: system-ui, sans-serif;
        "
      >
        <article
          style="
            width: min(100%, 560px);
            padding: 28px;
            border: 1px solid #35353c;
            border-radius: 18px;
            background: #232328;
          "
        >
          <h1>请通过开发服务器打开 ACG DNA Web</h1>
          <p><code>index.html</code> 是 Vite 源码入口，不能直接双击运行。</p>
          <p>请在仓库根目录打开终端并执行，然后在浏览器打开下方地址。</p>
          <button
            type="button"
            class="copy-code"
            data-copy="npm start"
            aria-label="复制启动命令 npm start"
            style="
              display: block;
              width: 100%;
              border: 0;
              padding: 14px 16px;
              color: #15d8c5;
              text-align: left;
              background: #18181b;
              cursor: pointer;
            "
          >
            <code>npm start</code>
          </button>
          <p style="margin-top: 22px">启动后打开：</p>
          <button
            type="button"
            class="copy-code"
            data-copy="http://127.0.0.1:5260/"
            aria-label="复制本地启动地址"
            style="
              display: block;
              width: 100%;
              border: 0;
              padding: 14px 16px;
              color: #15d8c5;
              text-align: left;
              background: #18181b;
              cursor: pointer;
            "
          >
            <code>http://127.0.0.1:5260/</code>
          </button>
          <p
            class="copy-status"
            aria-live="polite"
            style="min-height: 20px"
          ></p>
        </article>
      </main>
    </div>
    <script>
      document.querySelectorAll('.copy-code').forEach((button) => {
        button.addEventListener('click', async () => {
          const status = document.querySelector('.copy-status')
          try {
            await navigator.clipboard.writeText(button.dataset.copy)
            status.textContent = '已复制到剪贴板'
          } catch {
            status.textContent = '请手动复制上方内容'
          }
        })
      })
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
